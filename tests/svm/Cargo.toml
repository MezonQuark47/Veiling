[package]
name = "sealed-auction-svm-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Runs the compiled sealed_auction program in LiteSVM to test the instructions that need no MPC"

[dev-dependencies]
curve25519-dalek = "4.1.3"
litesvm = "0.16"
num-bigint = "0.4"
serde_json = "1"
solana-account = "~4.3"
solana-address = { version = "~2.6", features = ["curve25519", "decode"] }
solana-clock = "~3.1"
solana-instruction = "~3.4"
solana-keypair = "3.1"
solana-message = "4"
solana-sha256-hasher = "3.1"
solana-signer = "3.0"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-transaction = "4"
solana-transaction-error = "~3.3"

# Not part of the program's workspace.
[workspace]
