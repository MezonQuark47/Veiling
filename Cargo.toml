[workspace]
members = ["programs/*", "encrypted-ixs"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Optimise for size: deployment rent scales with program size.
opt-level = "z"
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
