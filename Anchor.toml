[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
sealed_auction = "CjUVaVK3jF9o4EehHWtB13TGg9SPXBWKGBepmZHwyLK2"

[programs.devnet]
sealed_auction = "CjUVaVK3jF9o4EehHWtB13TGg9SPXBWKGBepmZHwyLK2"

[provider]
cluster = "devnet"
# Devnet-only test wallet. Never send real (mainnet) SOL to it.
wallet = "~/.config/solana/devnet-test.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

[test.validator]
startup_wait = 10000
